<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Kishka Browser</title>
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; background: #f0f0f0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 80%; max-width: 600px; text-align: center; }
        h1 { margin-top: 0; }
        input { width: 80%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: #0078d7; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #005a9e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐈 Kishka Browser V1.5</h1>
        <p>Введіть URL сайту, щоб відкрити його в новому вікні:</p>
        <input type="text" id="urlInput" placeholder="https://example.com" />
        <button onclick="openUrl()">Відкрити</button>
    </div>
    <script src="src/main.js"></script>
</body>
</html>
