[package]
name = "kishka-browser"
version = "1.5.0"
description = "Kishka Browser"
authors = ["you"]
edition = "2021"

[lib]
name = "kishka_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
