name: Build Lite Chrome Setup

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconsole --onedir --icon=icon.ico --collect-all PyQt5 --collect-all PyQtWebEngine main.py

    - name: Copy Icon to Output Folder
      run: |
        copy icon.ico dist\main\icon.ico

    - name: Install Inno Setup
      run: |
        choco install innosetup -y

    - name: Compile Installer Setup.exe
      shell: cmd
      run: "\"C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe\" installer_script.iss"

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KishkaBrowser-Installer-File
        path: exe/Kishka-Browser-Installer.exe
