name: Build and Push Installer

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE with PyInstaller using Spec
      run: |
        pyinstaller main.spec

    - name: Copy Icon to Output Folder
      run: |
        copy icon.ico dist\main\icon.ico

    - name: Create exe Directory
      run: |
        if not exist exe mkdir exe

    - name: Install Inno Setup
      run: |
        choco install innosetup -y

    - name: Compile Installer Setup.exe
      shell: cmd
      run: "\"C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe\" installer_script.iss"

    - name: Commit and Push Installer to Repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add exe/Kishka-Browser-Installer.exe
        git commit -m "Auto-update Kishka-Browser-Installer.exe [skip ci]" || echo "No changes to commit"
        git push
