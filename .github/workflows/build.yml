name: Build Kishka Browser (Tauri)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-tauri:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Auto-Generate Icons
        run: npx @tauri-apps/cli icon icon.ico --fit cover

      - name: Build Tauri App
        run: npx @tauri-apps/cli build

      - name: Upload Installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: Kishka-Browser-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
