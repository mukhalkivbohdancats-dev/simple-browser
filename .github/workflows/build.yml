name: Build Kishka Browser Web Setup

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build EXE with PyInstaller
      run: pyinstaller main.spec

    - name: Upload EXE to GitHub Releases
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.5
        files: dist/Kishka-Browser_V1.5.exe
        overwrite: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Inno Setup
      run: choco install innosetup --no-progress -y

    - name: Build Web Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kishka-Browser-V1.5-Setup
        path: installer/Kishka-Browser_V1.5_Setup.exe
