name: Build Kishka Browser

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # ---------- Крок 1. Збірка .exe (потрібен лише як "начинка" для інсталятора) ----------
    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed ^
          --icon=icon.ico ^
          --name "Kishka-Browser_V1.4" ^
          --add-data "icon.ico;." ^
          main.py

    # ---------- Крок 2. Встановлення Inno Setup ----------
    - name: Install Inno Setup
      run: choco install innosetup --no-progress -y

    # ---------- Крок 3. Збірка інсталятора ----------
    - name: Build Installer with Inno Setup
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

    # ---------- Крок 4. Вивантаження ТІЛЬКИ інсталятора ----------
    - name: Upload Installer
      uses: actions/upload-artifact@v4
      with:
        name: Kishka-Browser-V1.4-Setup
        path: installer/Kishka-Browser_V1.4_Setup.exe
