name: Build and Push Installer V1.1

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE with PyInstaller using Spec
      run: |
        pyinstaller main.spec

    - name: Copy Icon to Output Folder
      run: |
        copy icon.ico dist\main\icon.ico

    - name: Install Inno Setup
      run: |
        choco install innosetup -y

    - name: Compile Installer Setup.exe
      shell: cmd
      run: "\"C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe\" installer_script.iss"

    - name: Commit and Push Installer to Repository
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-update Kishka-Browser-Installer_V1.1.exe [skip ci]"
        file_pattern: exe/Kishka-Browser-Installer_V1.2.exe
